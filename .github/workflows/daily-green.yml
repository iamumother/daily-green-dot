name: daily-green

# 每日绿点由 GitHub Actions 自动排期执行（2026-11-15 改回：Muse 侧连接器写仓每次都要人工审批，无法全自动）。
# Muse 侧排期已停用，避免一天多次提交。手动触发保留备用。
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append daily log and commit
        run: |
          # 提交署名：账号 iamumother 的 noreply 邮箱，GitHub 会把提交算到该账号。
          git config user.name "iamumother"
          git config user.email "355653176+iamumother@users.noreply.github.com"
          mkdir -p logs
          TODAY=$(date -u +%F)
          echo "- $TODAY daily check-in" >> "logs/$(date -u +%Y).md"
          git add .
          git commit -m "daily: $TODAY" || echo "nothing to commit"
          git push
